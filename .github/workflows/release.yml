name: Release

# Al empujar un tag de versión (v1.2.3): build, tests en los tres sistemas operativos, empaquetado
# y publicación en PyPI con twine. A mano (workflow_dispatch) publica en TestPyPI para ensayar.
#
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   PYPI_API_TOKEN       token de API de pypi.org con alcance al proyecto pdgseg-cli
#   TEST_PYPI_API_TOKEN  token de test.pypi.org (solo para el ensayo manual)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to attach the files to the GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade twine

      - name: The package version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          wheel=$(ls dist/*.whl)
          case "$wheel" in
            *"pdgseg_cli-${expected}-"*) echo "Versión $expected" ;;
            *) echo "::error::El wheel ($wheel) no tiene la versión del tag ($expected)"; exit 1 ;;
          esac

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive dist/*

      - name: Publish to TestPyPI (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive --repository testpypi --skip-existing dist/*

      - name: GitHub release with the files
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "pdgseg-cli $GITHUB_REF_NAME" --generate-notes
